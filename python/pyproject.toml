[project]
name = "zai"
version = "0.1.0"
description = "ZAI environment wrappers, trainers, remote agents and arena."
requires-python = ">=3.12"
# The `zai_sim` extension module is built from crates/zai-py with maturin.
# PyTorch is installed separately by the trainer image (CPU or CUDA 12.6 index); `onnx` is
# needed by `torch.onnx.export` (arena.export_model).
# `grpcio` / `protobuf` back the agent client (zai_agent); the stubs in zai_agent/proto are
# generated with grpcio-tools 1.85 (dev image, `make proto`), which needs these minimums.
dependencies = [
    "grpcio>=1.85",
    "gymnasium>=1.0",
    "numpy>=2.0",
    "onnx>=1.17",
    "protobuf>=7.36,<8",
    "pettingzoo>=1.24",
    "pyyaml>=6.0",
]

[project.scripts]
zai-balance-sweep = "arena.balance_sweep:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zai_env", "zai_rl", "zai_agent", "arena"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["zai_agent/proto"]  # generated by `make proto`

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
