# CPU-only by default (local pilot). For the NVIDIA GPU server add compose.gpu.yaml:
#   docker compose -f compose.yaml -f compose.gpu.yaml ...
services:
  dev:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    volumes:
      - .:/workspace
      - dev-cache:/cache
      - cargo-registry:/usr/local/cargo/registry
      - web-node-modules:/workspace/web/node_modules
    profiles: ["dev"]

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    ports:
      - "8080:8080"
      # Agent API (gRPC): local only, reach it from another machine through an SSH tunnel
      # (docs/ARCHITECTURE.md 4.9, decision E10).
      - "127.0.0.1:50051:50051"
    environment:
      # Optional bearer token required on every gRPC call (empty: none).
      ZAI_AGENT_TOKEN: ${ZAI_AGENT_TOKEN:-}
    volumes:
      - data:/data

  trainer:
    build:
      context: .
      dockerfile: docker/trainer.Dockerfile
      args:
        TORCH_INDEX: cpu
    shm_size: 8gb
    environment:
      ZAI_ZOMBIE_COUNT: ${ZAI_ZOMBIE_COUNT:-20}
      ZAI_FOOD_COUNT: ${ZAI_FOOD_COUNT:-120}
      ZAI_SERVER_URL: http://server:8080
      ZAI_CHECKPOINT_DIR: /checkpoints
      ZAI_RUNS_DIR: /runs
      ZAI_DATA_DIR: /data
      # Less fragmentation with the variable-size GRU batches of the updates (M6.0 profiling).
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    volumes:
      - checkpoints:/checkpoints
      - runs:/runs
      # Server data: arena.export_replays writes policy replays into /data/replays.
      - data:/data
    profiles: ["train"]

  # Remote gRPC agents (docs/ARCHITECTURE.md 4.9.4): `make showcase`, `make play`, `make
  # grpc-smoke`. Reuses whichever trainer image exists (CPU, or cu126 on the GPU server, run
  # without the GPU) and is capped at 2 CPUs so it cannot starve a league next to it.
  arena:
    image: zai-trainer
    cpus: 2
    environment:
      CUDA_VISIBLE_DEVICES: ""
      ZAI_GRPC_TARGET: server:50051
      ZAI_SERVER_URL: http://server:8080
      ZAI_CHECKPOINT_DIR: /checkpoints
      ZAI_AGENT_TOKEN: ${ZAI_AGENT_TOKEN:-}
    volumes:
      - checkpoints:/checkpoints:ro
    profiles: ["arena"]

  tensorboard:
    image: zai-trainer
    command: tensorboard --logdir /runs --host 0.0.0.0 --port 6006
    ports:
      - "6006:6006"
    volumes:
      - runs:/runs
    profiles: ["tensorboard"]

volumes:
  dev-cache:
  web-node-modules:
  cargo-registry:
  data:
  checkpoints:
  runs:
