# HTTPS in front of the server with Caddy and self-signed certificates (Caddy's local CA):
#
#   ZAI_TLS_SITES="zai.example.com:8080, gpu-server.lan:8080" \
#     docker compose -f compose.yaml -f compose.tls.yaml up -d server proxy
#
# Caddy takes over the published port 8080; the server stays reachable as http://server:8080
# inside the compose network (trainers post metrics there).
services:
  server:
    # Caddy takes 8080; the agent API stays published on localhost only.
    ports: !override ["127.0.0.1:50051:50051"]

  proxy:
    image: caddy:2.10.2-alpine
    depends_on: [server]
    ports:
      - "8080:8080"
      # gRPC over TLS (Caddy site of ZAI_GRPC_TLS_SITES, h2c to server:50051). Local only by
      # default; set ZAI_GRPC_TLS_PUBLISH=50052 (all interfaces) together with ZAI_AGENT_TOKEN.
      - "${ZAI_GRPC_TLS_PUBLISH:-127.0.0.1:50052}:50052"
    environment:
      ZAI_TLS_SITES: ${ZAI_TLS_SITES:-localhost:8080}
      ZAI_GRPC_TLS_SITES: ${ZAI_GRPC_TLS_SITES:-localhost:50052}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
