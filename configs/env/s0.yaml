# Curriculum stage S0 (docs/ARCHITECTURE.md section 4.4): small map, few zombies, short
# episodes and potential-based food shaping. Merged over the defaults (configs/env/default.yaml).
# Training samples the zombie count from the trainer's `zombie_counts`; this value is the one
# used for evaluation.
map_size_m: 150.0
house_count: 3
zombie_count: 3
food_count: 20
episode_cap_s: 300.0
min_spawn_distance_m: 50.0
reward:
  # Potential-based food shaping (reserve + proximity, see Env::human_potential).
  human_food_shaping: 1.0
  # Per-zombie distance potential 0.5 * (1 - min(d, 100) / 100) (see Env::zombie_potentials).
  zombie_distance_shaping: 0.5
  # No step penalty on S0: with rare catches it made a starvation ending worth ~40% of a
  # catch (docs/ARCHITECTURE.md section 4.6); gamma already favors early catches.
  zombie_step_penalty: 0.0
