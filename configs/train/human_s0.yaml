# M4: human recurrent PPO vs scripted zombies on curriculum stage S0.
# Sized for the CPU pilot; on the P100 server raise num_envs (e.g. 1024) and num_threads (20).
env_config: configs/env/s0.yaml
zombie_counts: [2, 3, 4]
total_steps: 20000000
seed: 0
num_threads: 4
torch_threads: 4
device: auto
eval_every: 10
eval_episodes: 64
checkpoint_every: 20
ppo:
  num_envs: 128
  rollout: 128
  bptt: 64
  epochs: 4
  minibatches: 8
  lr: 0.0003
  gamma: 0.995
  gae_lambda: 0.95
  clip: 0.2
  ent_start: 0.01
  ent_end: 0.001
  vf_coef: 0.5
  max_grad_norm: 0.5
  hidden: 256
