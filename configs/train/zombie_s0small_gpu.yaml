# M5 warm-up on the GPU server: zombie MAPPO vs the scripted human on s0_small (75 m map, 50
# food, 3 next to the spawn), started after zombie-s0-gpu1 plateaued at 1-3% caught on S0. No
# frozen-human eval: observations are normalized by map size, so the M4 human (trained on
# 150 m) is out of distribution here.
env_config: configs/env/s0_small.yaml
zombie_counts: [2, 3, 4]
opponent: scripted
total_steps: 200000000
seed: 0
num_threads: 20
torch_threads: 4
device: cuda
eval_every: 20
eval_episodes: 128
baseline_episodes: 256
checkpoint_every: 20
replay_every: 25
replay_episodes: 2
mappo:
  num_envs: 1024
  rollout: 128
  bptt: 64
  epochs: 3
  minibatches: 8
  lr: 0.0003
  gamma: 0.995
  gae_lambda: 0.95
  clip: 0.2
  ent_start: 0.01
  ent_end: 0.001
  vf_coef: 0.5
  max_grad_norm: 0.5
  hidden: 128
