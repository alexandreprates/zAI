# M6 full run on the GPU server (docs/ARCHITECTURE.md sections 4.8.1 and 4.8.9 step 7): the
# curriculum s0_small -> S0 -> S1 with the gates of 4.8.1, from the distilled starters. A gate
# that fails at its stage's maximum budget stops the run (a user decision point, not a retry).
# Both exploitability probes run at every gate check (about 20 min each) and every 200 M steps.
# The top-level env_config / zombie_counts are only used for the learners' sizes.
env_config: configs/env/s0_small.yaml
zombie_counts: [3, 6, 9]
stage: s0_small
num_envs: 1024
total_steps: 1300000000
seed: 0
num_threads: 20
torch_threads: 4
device: cuda
human_init: /checkpoints/human/human-s0small-distill/final.pt
zombie_init: /checkpoints/zombie/zombie-s0small-crowd-distill/final.pt
seeds:
  - {side: zombie, path: /checkpoints/zombie/zombie-s0small-m5-distill/final.pt, id: zombie-m5}
  - {side: human, path: /checkpoints/human/human-s0-m4-distill/final.pt, id: human-m4}
gate_every: 40
gate_episodes: 128
probe_at_gates: true
probe_steps: 10000000
probe_every_steps: 200000000
stages:
  - name: s0_small
    env_config: configs/env/s0_small.yaml
    zombie_counts: [3, 6, 9]
    min_steps: 100000000
    max_steps: 300000000
    gate:
      survived_min: 0.8
      caught_min: 0.8
      balance: [0.2, 0.8]
      forgetting_min: 0.55
      elo_gain: 100
      probe_gap_max: 0.2
  - name: s0
    env_config: configs/env/s0.yaml
    zombie_counts: [4, 6, 8]
    min_steps: 100000000
    max_steps: 500000000
    gate:
      survived_min: 0.6
      survived_over_baseline: 0.1
      caught_times_baseline: 3
      caught_over_baseline: 0.15
      caught_ci_above_baseline: true
      balance: [0.2, 0.8]
      forgetting_min: 0.55
      elo_gain: 100
      probe_gap_max: 0.2
  # S1 -> S2 is reported, not required for M6 (4.8.8): the run ends at S1's maximum budget.
  - name: s1
    env_config: configs/env/s1.yaml
    zombie_counts: [8, 12, 16]
    min_steps: 200000000
    max_steps: 500000000
    gate:
      survived_min: 0.6
      survived_over_baseline: 0.1
      caught_times_baseline: 3
      caught_over_baseline: 0.15
      caught_ci_above_baseline: true
      balance: [0.25, 0.75]
      forgetting_min: 0.55
      elo_gain: 100
      probe_gap_max: 0.2
eval_every: 20
eval_episodes: 128
checkpoint_every: 20
league:
  shares: [0.5, 0.25, 0.25]
  slots: 4
  scripted_share: 0.2
  lease_iters: 5
  snapshot_every_steps: 10000000
  pfsp: hard
  # Engage the imbalance guard earlier than the defaults (short run league-s0small-short1:
  # s_z fell to 0.15 without the guard engaging).
  guard_low: 0.3
  guard_high: 0.7
  guard_windows: 2
  guard_release: [0.35, 0.65]
human:
  rollout: 128
  bptt: 64
  epochs: 4
  minibatches: 8
  lr: 0.0001
  ent_start: 0.005
  ent_end: 0.001
  hidden: 256
zombie:
  rollout: 128
  bptt: 64
  epochs: 4
  minibatches: 8
  lr: 0.0003  # 1.5e-4 barely moved the zombies in league-s0small-short1 (approx_kl ~0.001)
  ent_start: 0.005
  ent_end: 0.001
  hidden: 128
