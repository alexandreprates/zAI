# M4 on the GPU server (Tesla P100, 24 CPU cores, 64 GB RAM): same algorithm and stage as
# human_s0.yaml, sized up. 20 simulation threads leave 4 cores for the trainer process.
# A 128-step rollout at 1024 envs is 131 k transitions (~2.5 GB of observations in FP32).
env_config: configs/env/s0.yaml
zombie_counts: [2, 3, 4]
total_steps: 200000000
seed: 0
num_threads: 20
torch_threads: 4
device: cuda
eval_every: 10
eval_episodes: 128
checkpoint_every: 20
replay_every: 25
replay_episodes: 2
ppo:
  num_envs: 1024
  rollout: 128
  bptt: 64
  epochs: 4
  minibatches: 8
  lr: 0.0003
  gamma: 0.995
  gae_lambda: 0.95
  clip: 0.2
  ent_start: 0.01
  ent_end: 0.001
  vf_coef: 0.5
  max_grad_norm: 0.5
  hidden: 256
