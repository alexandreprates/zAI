# Zombie fine-tune on the GPU server (first co-training step): the M5 team
# (zombie-s0small-gpu1, trained with 2-4 zombies against the scripted human) continues on
# s0_small with 8-10 zombies against the frozen fine-tuned human (human-s0small-ft1, ~96%
# survival against that team even with 10 zombies), so the team has to learn to hunt a
# learned human as a crowd. `eval_scripted/*` tracks the scripted-human catch rate.
env_config: configs/env/s0_small.yaml
zombie_counts: [8, 9, 10]
opponent: policy
human_checkpoint: /checkpoints/human/human-s0small-ft1/final.pt
init_checkpoint: /checkpoints/zombie/zombie-s0small-gpu1/latest.pt
total_steps: 100000000
seed: 2
num_threads: 20
torch_threads: 4
device: cuda
eval_every: 20
eval_episodes: 128
baseline_episodes: 256
checkpoint_every: 20
replay_every: 25
replay_episodes: 2
mappo:
  num_envs: 1024
  rollout: 128
  bptt: 64
  epochs: 3
  minibatches: 8
  lr: 0.00015
  gamma: 0.995
  gae_lambda: 0.95
  clip: 0.2
  ent_start: 0.005
  ent_end: 0.001
  vf_coef: 0.5
  max_grad_norm: 0.5
  hidden: 128
