# M6.3 CPU pilot of the league trainer (docs/ARCHITECTURE.md section 4.8.9 step 3): s0_small,
# 128 envs, learners from scratch, pool seeded only with the scripted bots, a snapshot every
# 0.5 M env steps. Checks the mechanics (pool growth, leases, guard, checkpoints), not learning.
env_config: configs/env/s0_small.yaml
stage: s0_small
zombie_counts: [3, 6, 9]
num_envs: 128
total_steps: 2000000
seed: 0
num_threads: 8
torch_threads: 4
device: cpu
eval_every: 20
eval_episodes: 32
checkpoint_every: 20
league:
  snapshot_every_steps: 500000
human:
  rollout: 128
  bptt: 64
  epochs: 4
  minibatches: 8
  lr: 0.0003
  hidden: 256
zombie:
  rollout: 128
  bptt: 64
  epochs: 3
  minibatches: 8
  lr: 0.0003
  hidden: 128
