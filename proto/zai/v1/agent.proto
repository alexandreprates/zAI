// ZAI agent API (docs/ARCHITECTURE.md section 4.9.2): external processes play one side of a
// server match. Observations are the raw f32 vectors written by zai_sim::obs, the same bytes
// the training env produces; no field hardcodes a dimension, clients read them from GetInfo.
syntax = "proto3";
package zai.v1;

service AgentService {
  // Versions, observation layouts and action dimensions of this server build.
  rpc GetInfo(GetInfoRequest) returns (ServerInfo);
  // Same semantics as POST /api/matches.
  rpc CreateMatch(CreateMatchRequest) returns (MatchCreated);
  // One stream per (match, side): Join first, then one Actions per Observation.
  rpc Play(stream ClientMessage) returns (stream ServerMessage);
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_HUMAN = 1;
  SIDE_ZOMBIES = 2;
}

message GetInfoRequest {}

// One block of an observation vector: `slots` consecutive groups of `fields`
// (HUMAN_LAYOUT / ZOMBIE_LAYOUT in obs.rs); `len` = slots * len(fields).
message LayoutBlock {
  string name = 1;
  uint32 start = 2;
  uint32 len = 3;
  uint32 slots = 4;
  repeated string fields = 5;
}

message SideSpec {
  uint32 obs_dim = 1;
  repeated LayoutBlock blocks = 2;
  // Human [MOVE_ACTIONS, INTERACT_ACTIONS], zombie [MOVE_ACTIONS].
  repeated uint32 action_dims = 3;
}

message ServerInfo {
  string version = 1;   // zai_sim::VERSION
  uint32 protocol = 2;  // PROTOCOL_VERSION
  uint32 obs_version = 3;
  SideSpec human = 4;
  SideSpec zombie = 5;
  string base_config_json = 6;  // the server's base config after env overrides
}

message CreateMatchRequest {
  string config_json = 1;  // partial config merged over the base (Rust validates)
  optional uint64 seed = 2;
  string human = 3;        // "remote" | "scripted" | "random" | "policy:<model id>"
  string zombies = 4;
  float speed = 5;         // 0 = unthrottled, else x0.25-x16
  bool auto_restart = 6;
  bool realtime = 7;       // only with remote sides and speed > 0
  bool deterministic = 8;  // in-process policy sides only
}

message MatchCreated {
  string match_id = 1;
}

message ClientMessage {
  oneof msg {
    Join join = 1;
    Actions actions = 2;
  }
}

message Join {
  string match_id = 1;
  Side side = 2;
  // Refused with FAILED_PRECONDITION unless they equal the server's.
  uint32 protocol = 3;
  uint32 obs_version = 4;
  uint32 obs_dim = 5;
  string agent_name = 6;  // stored in the match info and replays
}

message Actions {
  uint32 episode = 1;
  uint32 tick = 2;
  bytes actions = 3;  // u8: human [movement, interact], zombies [N]
}

message ServerMessage {
  oneof msg {
    Joined joined = 1;
    EpisodeStart start = 2;
    Observation obs = 3;
    EpisodeEnd end = 4;
    MatchEnd match_end = 5;
  }
}

message Joined {
  string match_id = 1;
  Side side = 2;
  bool realtime = 3;
  float decision_dt = 4;
}

message EpisodeStart {
  uint32 episode = 1;
  uint64 seed = 2;
  uint32 num_agents = 3;
  string config_json = 4;  // effective config, rebuilds the same zai_sim.Env
}

message Observation {
  uint32 episode = 1;
  uint32 tick = 2;
  uint32 num_agents = 3;
  uint32 obs_dim = 4;
  bytes obs = 5;             // little-endian f32 [num_agents, obs_dim]
  bytes mask = 6;            // human: MOVE_ACTIONS + INTERACT_ACTIONS x u8; zombies: empty
  repeated float reward = 7; // per agent, of the step that led here (0 at tick 0)
  uint64 state_hash = 8;     // Env::state_hash after that step
  float time = 9;
  uint32 deadline_ms = 10;   // realtime only: time left to answer; 0 in lockstep
}

message EpisodeEnd {
  uint32 episode = 1;
  string outcome = 2;
  uint32 ticks = 3;
  repeated float reward = 4;
  uint64 state_hash = 5;
  string replay_id = 6;
}

message MatchEnd {
  string status = 1;  // finished | stopped | failed
  string reason = 2;
}
